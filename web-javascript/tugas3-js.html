<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3 JavaScript</title>
</head>
<body>
    <h1>Tugas 3 JavaScript</h1>

    <script type="text/javascript">
        let angka1 = 10;
        let angka2 = 5;

        // Penjumlahan
        let hasil1 = angka1 + angka2;
        document.write("Hasil Penjumlahan: " + hasil1 + "<br>");

        // Pengurangan
        let hasil2 = angka1 - angka2;
        document.write("Hasil Pengurangan: " + hasil2 + "<br>");

        // Perkalian
        let hasil3 = angka1 * angka2;
        document.write("Hasil Perkalian: " + hasil3 + "<br>");

        // Pembagian
        let hasil4 = angka1 / angka2;
        document.write("Hasil Pembagian: " + hasil4 + "<br>");
    </script>
</body>
</html>
